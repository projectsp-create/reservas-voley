# Consulta la base de datos cada 2 días para que Supabase (plan gratis) no la pause por inactividad.
name: Mantener Supabase activo
on:
  schedule:
    - cron: '17 13 */2 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar el calendario
        run: |
          URL=$(grep -oP "SUPABASE_URL:\s*'\K[^']+" config.js)
          KEY=$(grep -oP "SUPABASE_KEY:\s*'\K[^']+" config.js)
          curl -fsS -X POST "$URL/rest/v1/rpc/calendario" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}' -o /dev/null
          echo "Supabase activo ✅"
